<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MFC Now Playing – Minimal Clean</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="overlay" data-source="">
    <div class="card">
      <div class="artwork-container">
        <img class="artwork-img" alt="" />
        <div class="artwork-fallback">&#9835;</div>
      </div>
      <div class="meta">
        <div class="track-title"></div>
        <div class="track-artist"></div>
        <div class="bottom-row">
          <span class="state-dot"></span>
          <span class="source-badge"></span>
          <div class="progress-bar">
            <div class="progress-fill"></div>
          </div>
          <span class="time-current">0:00</span>
          <span class="time-sep">/</span>
          <span class="time-duration">0:00</span>
        </div>
      </div>
    </div>
    <!-- Hidden elements so overlay.js doesn't error on selectors -->
    <div class="track-album" style="display:none"></div>
    <div class="artwork-glow" style="display:none"></div>
    <div class="visualizer" style="display:none"><div class="viz-bar"></div></div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
