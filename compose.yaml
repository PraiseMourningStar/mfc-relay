services:
  mfc-now-playing-relay:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      PUBLIC_BASE_URL: "https://nowplaying.mfc.example"
      DATA_DIR: "/app/data"
      ADMIN_KEY: "change-me"
    volumes:
      - mfc-relay-data:/app/data

volumes:
  mfc-relay-data:
